name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install rubra-sdk
        run: pip install "rubra>=0.1.0"
        # For development with local SDK:
        # run: pip install git+https://github.com/pm1715/rubra-sdk.git

      - name: Install server dependencies
        run: pip install fastapi "uvicorn[standard]" pydantic-settings httpx pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short
